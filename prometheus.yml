global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "inventory-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:5000"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:4000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]